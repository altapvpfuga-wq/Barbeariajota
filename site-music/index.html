<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Music</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music" />
  <meta name="theme-color" content="#030303" />
  <link rel="preconnect" href="https://api.audius.co" crossorigin>
  <link rel="preconnect" href="https://creatornode.audius.co" crossorigin>
  <link rel="dns-prefetch" href="https://api.audius.co">
  <link rel="dns-prefetch" href="https://creatornode.audius.co">
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="top-left">
          <button class="ico-btn" id="btnBack" data-icon="back" style="display:none" aria-label="Voltar"></button>
          <h1 class="top-title" id="topTitle">Início</h1>
        </div>
        <div class="top-right" id="topRight"></div>
      </div>
    </header>
    <main class="screens" id="screens">
      <section class="screen" id="screen-inicio"></section>
      <section class="screen" id="screen-pesquisar"></section>
      <section class="screen" id="screen-biblioteca"></section>
      <section class="screen" id="screen-config"></section>
      <section class="screen" id="screen-detalhe"></section>
    </main>
    <nav class="bottomnav" id="bottomnav">
      <button class="bn-item" data-route="inicio">
        <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
        <span>Início</span>
      </button>
      <button class="bn-item" data-route="pesquisar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Pesquisar</span>
      </button>
      <button class="bn-item" data-route="biblioteca">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z"/></svg>
        <span>Biblioteca</span>
      </button>
    </nav>
    <div class="minip" id="minip" style="display:none">
      <div class="minip-cover" id="minipCover"></div>
      <div class="minip-info">
        <div class="minip-title" id="minipTitle"></div>
        <div class="minip-artist" id="minipArtist"></div>
      </div>
      <button class="minip-btn" id="minipPrev" data-icon="prev" aria-label="Anterior"></button>
      <button class="minip-btn" id="minipPlay" aria-label="Play/Pause"></button>
      <button class="minip-btn" id="minipNext" data-icon="next" aria-label="Próxima"></button>
      <div class="minip-progress"><div class="minip-fill" id="minipFill"></div></div>
    </div>
    <div class="player" id="player" style="display:none">
      <div class="player-bg" id="playerBg"></div>
      <div class="player-head">
        <button class="ico-btn" id="playerClose" data-icon="down" aria-label="Fechar player"></button>
        <div class="player-head-title" id="playerAlbum"></div>
        <button class="ico-btn" id="playerMore" data-icon="more" aria-label="Mais opções"></button>
      </div>
      <div class="player-slide" id="playerSlide">
        <div class="player-cover-wrap">
          <div class="player-cover" id="playerCover"></div>
        </div>
        <div class="player-meta">
          <div class="player-title" id="playerTitle"></div>
          <div class="player-artist" id="playerArtist"></div>
        </div>
      </div>
      <div class="player-progress">
        <div class="prog-bar" id="progBar"><div class="prog-fill" id="progFill"></div><div class="prog-thumb" id="progThumb"></div></div>
        <div class="prog-times"><span id="progCur">0:00</span><span class="prog-sep">/</span><span id="progDur">0:00</span></div>
        <div class="player-error" id="playerError" style="display:none"></div>
      </div>
      <div class="player-controls">
        <button class="pctrl" id="pShuffle" data-icon="shuffle" aria-label="Aleatório"></button>
        <button class="pctrl" id="pPrev" data-icon="prev" aria-label="Anterior"></button>
        <button class="pctrl play" id="pPlay" aria-label="Play/Pause"></button>
        <button class="pctrl" id="pNext" data-icon="next" aria-label="Próxima"></button>
        <button class="pctrl" id="pRepeat" data-icon="repeat" aria-label="Repetir"></button>
      </div>
      <div class="player-extra">
        <button class="pextra" id="pLike" aria-label="Favoritar"></button>
        <button class="pextra" id="pLyrics" data-icon="lyrics" title="Letras" aria-label="Letras"></button>
        <button class="pextra" id="pDownload" aria-label="Baixar"></button>
        <button class="pextra" id="pQueue" data-icon="queue" title="Fila" aria-label="Fila"></button>
      </div>
      <div class="player-queue" id="playerQueue" style="display:none">
        <div class="queue-head">Fila de reprodução</div>
        <div id="queueList"></div>
      </div>
      <div class="lyrics-sheet" id="lyricsSheet" style="display:none">
        <div class="lyrics-head">
          <button class="ico-btn" id="lyricsClose" data-icon="down" aria-label="Fechar letras"></button>
          <div class="lyrics-head-title">Letras</div>
          <button class="lyrics-ai" id="lyricsTranslate" type="button">Traduzir (IA)</button>
        </div>
        <div class="lyrics-body" id="lyricsBody"></div>
      </div>
    </div>
    <div class="perm-overlay" id="permOverlay" style="display:none"></div>
    <div class="toast" id="toast"></div>
  </div>
  <audio id="audioEl" preload="auto" playsinline></audio>
  <script src="catalog.js"></script>
  <script src="lyrics.js"></script>
  <script src="app.js"></script>
</body>
</html>
